<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Портал ДПО{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <style>
        :root {
            --bg: #f7f5f1; --ink: #182b3a; --ink-soft: #5c6b7a;
            --blue: #1d4ed8; --teal: #0d9488;
            --grad: linear-gradient(120deg, #1d4ed8, #0d9488);
            --card: #fff; --line: #e6e1d8;
            --serif: Georgia, 'Times New Roman', serif;
            --sans: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --shadow: 0 10px 40px rgba(24,43,58,.10);
            --shadow-lg: 0 24px 70px rgba(24,43,58,.16);
            --radius: 18px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
        
        .top-navbar { background: #182b3a; color: white; padding: 18px 4vw; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); z-index: 10; }
        .top-navbar h1 { font-family: var(--serif); font-size: 20px; font-weight: normal; }
        .top-navbar a { color: #bdc3c7; text-decoration: none; margin-left: 20px; font-size: 14px; transition: 0.3s; }
        .top-navbar a:hover { color: white; }
        
        .main-wrapper { display: flex; flex: 1; }
        .content-area { flex: 1; width: 100%; }
        
        .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--line); padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar h2 { font-family: var(--serif); text-align: center; margin-bottom: 20px; font-size: 18px; color: var(--ink-soft); }
        .sidebar a { color: var(--ink-soft); text-decoration: none; padding: 14px 24px; display: block; font-size: 15px; font-weight: 600; transition: 0.2s; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #f7f5f1; color: var(--blue); border-left-color: var(--blue); }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 10px; font-weight: 700; font-family: var(--sans); cursor: pointer; border: none; text-decoration: none; transition: transform 0.2s, filter 0.2s; font-size: 14px; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-primary { background: var(--grad); color: white; box-shadow: 0 8px 20px rgba(29,78,216,.28); }
        .btn-accept { background: linear-gradient(120deg, #0d9488, #0f766e); color: white; box-shadow: 0 8px 20px rgba(13,148,136,.3); }
        .btn-reject { background: linear-gradient(120deg, #dc2626, #b91c1c); color: white; box-shadow: 0 8px 20px rgba(220,38,38,.25); }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px 16px; font-size: 15px; font-family: var(--sans); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; color: var(--ink); transition: border-color .3s, box-shadow .3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(29,78,216,.14); }

        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(24,43,58,.45); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay .modal { width: 100%; max-width: 460px; background: #fff; border-radius: 20px; padding: 36px; box-shadow: var(--shadow-lg); animation: pop .3s ease; border-top: 5px solid; border-image: linear-gradient(90deg, var(--blue), var(--teal)) 1; }
        @keyframes pop { from { transform: scale(.95) translateY(12px); opacity: 0; } }
        .modal h2 { font-family: var(--serif); margin: 0 0 22px; font-size: 24px; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="/static/images/logo.png" alt="Логотип" style="height: 35px; width: auto; background: white; border-radius: 4px; padding: 2px;">
            <h1>Портал Отдела ДПО</h1>
        </div>
        <div>
            {% if request.cookies.get('access_token') %}
                <a href="/logout">Выйти</a>
            {% else %}
                <a href="/login">Вход для сотрудников</a>
            {% endif %}
        </div>
    </div>

    <div class="main-wrapper">
        {% if request.cookies.get('access_token') %}
        <div class="sidebar">
            <h2>Меню управления</h2>
            <a href="/admin" class="{% if active_page == 'admin' %}active{% endif %}">Заявления</a>
            <a href="/admin/programs" class="{% if active_page == 'admin_programs' %}active{% endif %}">Программы обучения</a>
            <a href="/docs" target="_blank">API (Swagger)</a>
        </div>
        {% endif %}

        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
