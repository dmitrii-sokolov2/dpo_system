<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему - Отдел ДПО</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { display: flex; height: 100vh; background: #f4f7f6; }
        
        /* Левая панель (синяя) */
        .login-left { flex: 1; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; display: flex; flex-direction: column; justify-content: center; padding: 50px; position: relative; overflow: hidden; }
        .login-left h1 { font-size: 36px; margin-bottom: 20px; z-index: 1; }
        .login-left p { font-size: 16px; opacity: 0.8; line-height: 1.6; max-width: 400px; z-index: 1; }
        
        /* Декоративные круги на фоне */
        .circle { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.05); }
        .c1 { width: 300px; height: 300px; top: -50px; right: -50px; }
        .c2 { width: 500px; height: 500px; bottom: -100px; left: -100px; }

        /* Правая панель (форма) */
        .login-right { flex: 1; display: flex; justify-content: center; align-items: center; background: white; }
        .form-container { width: 100%; max-width: 400px; padding: 40px; }
        
        .form-header { margin-bottom: 40px; text-align: center; }
        .form-header h2 { color: #2c3e50; font-size: 28px; margin-bottom: 10px; }
        .form-header p { color: #7f8c8d; font-size: 14px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #34495e; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px 15px; border: 2px solid #e0e6ed; border-radius: 6px; font-size: 15px; transition: 0.3s; background: #f8fafc; }
        .input-group input:focus { border-color: #3498db; outline: none; background: white; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1); }

        .btn-login { width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #2980b9; }

        .error-msg { background: #fadbd8; color: #c0392b; padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 20px; text-align: center; }
        
        .back-link { display: block; text-align: center; margin-top: 30px; color: #7f8c8d; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #3498db; }
    </style>
</head>
<body>

    <!-- Левая часть -->
    <div class="login-left">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <h1>Отдел ДПО</h1>
        <p>Единая информационная система управления дополнительным профессиональным образованием. Авторизуйтесь для доступа к панели сотрудника.</p>
    </div>

    <!-- Правая часть -->
    <div class="login-right">
        <div class="form-container">
            <div class="form-header">
                <h2>Вход в систему</h2>
                <p>Введите корпоративные данные</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="input-group">
                    <label>Логин сотрудника</label>
                    <input type="text" name="username" required placeholder="admin">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required placeholder="••••••">
                </div>
                <button type="submit" class="btn-login">Войти в панель</button>
            </form>

            <a href="/" class="back-link">← Вернуться на сайт для слушателей</a>
        </div>
    </div>

</body>
</html>
